[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-parts"
version = "0.1.0"
description = "Parametric standard parts library on build123d, built for AI assembly workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["build123d>=0.10.0,<0.12"]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
cadparts = "cadparts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
