[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-parts"
version = "0.0.1"
description = "Parametric standard parts library on build123d, built for AI assembly workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["build123d>=0.5.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
